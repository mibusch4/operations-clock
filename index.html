<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Operations Clock v1.2 Rotating Earth Prototype</title>

<style>
:root {
    color-scheme: dark;
    --clock-color: #8e5cff;
    --accent-color: #50e3c2;
    --muted-color: #79768a;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
}

body {
    display: grid;
    place-items: center;
    color: var(--clock-color);
    font-family: "Segoe UI", Arial, sans-serif;
}

/* =========================================================
   ROTATING PHASED WIREFRAME EARTH PROTOTYPE
   ========================================================= */

.earth-background {
    position: fixed;
    z-index: 0;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

/*
   Three.js inserts its canvas inside this container.
*/
.earth-background canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/*
   If WebGL or Three.js fails, display the existing PNG
   rather than leaving the right side completely empty.
*/
.earth-background.fallback {
    background-image: url("phased-wireframe-earth-v1.png");
    background-repeat: no-repeat;
    background-size: 100% auto;
    background-position: right center;
    opacity: 0.4;
}

/* Existing star field */
body::before {
    position: fixed;
    z-index: 1;
    inset: 0;
    content: "";
    opacity: 0.07;
    pointer-events: none;
    background-image:
        radial-gradient(1px 1px at 24px 38px, #fff 99%, transparent),
        radial-gradient(1px 1px at 152px 116px, #fff 99%, transparent),
        radial-gradient(1.5px 1.5px at 258px 194px, #fff 99%, transparent);
    background-size: 320px 260px;
    animation: star-drift 90s linear infinite;
}

@keyframes star-drift {
    to {
        background-position: 320px 260px;
    }
}

.clock {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100%;
    padding: 5vh 4vw;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    /* Preserve your finalized left-side clock position */
    transform: translateX(-20vw);
}

.eyebrow {
    margin-bottom: clamp(1rem, 3vh, 2.5rem);
    color: var(--muted-color);
    font-size: clamp(0.7rem, 1.2vw, 1rem);
    font-weight: 600;
    letter-spacing: 0.42em;
    text-transform: uppercase;
}

.time-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(1rem, 3vw, 2.5rem);
    white-space: nowrap;
}

#time {
    color: var(--clock-color);
    font-size: clamp(8.64rem, 30.24vw, 24.48rem);
    font-weight: 650;
    letter-spacing: -0.075em;
    line-height: 0.88;
    font-variant-numeric: tabular-nums;
    text-shadow:
        0 0 5px rgba(142, 92, 255, 0.5),
        0 0 10px rgba(142, 92, 255, 0.35),
        0 0 20px rgba(142, 92, 255, 0.25);
}

.time-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.18em;
    padding-top: 0.12em;
    color: var(--accent-color);
    text-align: center;
    font-variant-numeric: tabular-nums;
}

#seconds {
    width: 2ch;
    font-size: clamp(2rem, 6vw, 5.5rem);
    font-weight: 500;
    line-height: 0.95;
    text-align: center;
}

#period {
    width: 100%;
    font-size: clamp(0.9rem, 2.2vw, 1.8rem);
    font-weight: 700;
    letter-spacing: 0.16em;
    line-height: 1;
    text-align: center;
}

.date-rule {
    width: min(38vw, 30rem);
    height: 1px;
    margin: clamp(1.5rem, 4vh, 3rem) 0 clamp(1rem, 2.4vh, 1.8rem);
    background: linear-gradient(
        90deg,
        transparent,
        rgba(80, 227, 194, 0.55),
        transparent
    );
}

#date {
    color: #c4c0d0;
    font-size: clamp(0.8rem, 1.65vw, 1.35rem);
    font-weight: 500;
    letter-spacing: 0.3em;
}

@media (max-width: 600px) {
    .clock {
        padding-right: 3vw;
        padding-left: 3vw;
    }

    #time {
        font-size: clamp(7.2rem, 30.24vw, 11.52rem);
    }

    .time-row {
        gap: 3vw;
    }

    #seconds {
        font-size: clamp(1.7rem, 6vw, 2.5rem);
    }

    #period {
        font-size: clamp(0.8rem, 2.2vw, 1rem);
    }

    #date {
        letter-spacing: 0.18em;
    }
}
</style>
</head>

<body>

<!-- Rotating globe canvas is inserted here -->
<div
    id="earth-background"
    class="earth-background"
    aria-hidden="true">
</div>

<main class="clock" aria-label="Current local time and date">
    <div class="eyebrow">Operations clock</div>

    <div class="time-row" aria-live="off">
        <div id="time"></div>

        <div class="time-meta">
            <div id="seconds"></div>
            <div id="period"></div>
        </div>
    </div>

    <div class="date-rule" aria-hidden="true"></div>
    <div id="date"></div>
</main>

<!-- =======================================================
     EXISTING CLOCK SCRIPT
     ======================================================= -->

<script>
const timeFormatter = new Intl.DateTimeFormat("en-US", {
    hour: "numeric",
    minute: "2-digit",
    second: "2-digit",
    hour12: true
});

const dateFormatter = new Intl.DateTimeFormat("en-US", {
    weekday: "long",
    month: "long",
    day: "numeric"
});

function updateClock() {
    const now = new Date();

    const parts = Object.fromEntries(
        timeFormatter
            .formatToParts(now)
            .map(({ type, value }) => [type, value])
    );

    const secondsElement = document.getElementById("seconds");
    const secondsChanged =
        secondsElement.textContent !== parts.second;

    document.getElementById("time").textContent =
        `${parts.hour}:${parts.minute}`;

    secondsElement.textContent = parts.second;

    if (secondsChanged) {
        pulseSeconds();
    }

    document.getElementById("period").textContent =
        parts.dayPeriod;

    document.getElementById("date").textContent =
        dateFormatter.format(now).toUpperCase();
}

function pulseSeconds() {
    document.getElementById("seconds").animate(
        [
            {
                textShadow:
                    "0 0 0 rgba(80, 227, 194, 0)"
            },
            {
                textShadow:
                    "0 0 12px rgba(80, 227, 194, 0.975)",
                offset: 0.35
            },
            {
                textShadow:
                    "0 0 0 rgba(80, 227, 194, 0)"
            }
        ],
        {
            duration: 700,
            easing: "ease-out"
        }
    );
}

updateClock();
setInterval(updateClock, 1000);
</script>

<!-- =======================================================
     ROTATING EARTH SCRIPT

     Three.js is loaded from a CDN. The browser must have
     internet access when the page loads.
     ======================================================= -->

<script type="module">
import * as THREE from
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.186.1/three.module.min.js";

const earthContainer =
    document.getElementById("earth-background");

try {
    const scene = new THREE.Scene();

    /*
       Camera uses normalized 3D coordinates. The globe is
       shifted right through its X position below.
    */
    const camera = new THREE.PerspectiveCamera(
        34,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({
        alpha: true,
        antialias: true,
        powerPreference: "low-power"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio || 1, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setClearColor(0x000000, 0);

    earthContainer.appendChild(renderer.domElement);

/*
   OUTER GROUP:
   Controls globe position and establishes the fixed
   planetary axis. This group does NOT rotate.
*/
const earthTiltGroup = new THREE.Group();

earthTiltGroup.position.set(3.1, -0.35, 0);

earthTiltGroup.rotation.z =
    THREE.MathUtils.degToRad(-23.5);

scene.add(earthTiltGroup);

/*
   INNER GROUP:
   Earth itself rotates inside the stationary tilted axis.
*/
const earthGroup = new THREE.Group();

earthTiltGroup.add(earthGroup);

    /*
       SphereGeometry creates latitude and longitude segments.
       The material renders only the geometry edges.
    */
    const globeGeometry = new THREE.SphereGeometry(
        3.35,
        36,
        24
    );

    const edgeGeometry =
        new THREE.EdgesGeometry(globeGeometry, 1);

    /*
       Soft silver-white line layer.
    */
    const wireMaterial =
        new THREE.LineBasicMaterial({
            color: 0xe8edf3,
            transparent: true,
            opacity: 0.23
        });

    const wireframe =
        new THREE.LineSegments(
            edgeGeometry,
            wireMaterial
        );

    earthGroup.add(wireframe);

    /*
       Second, slightly larger layer creates a restrained glow.
       This is intentionally weak.
    */
    const glowMaterial =
        new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.055
        });

    const glowWireframe =
        new THREE.LineSegments(
            edgeGeometry,
            glowMaterial
        );

    glowWireframe.scale.setScalar(1.006);
    earthGroup.add(glowWireframe);

    /*
       One full rotation every 10 minutes.

       10 minutes = 600,000 milliseconds.
    */
    const rotationDuration = 30000;

    let previousTimestamp = performance.now();

    function animate(timestamp) {
        const elapsed =
            timestamp - previousTimestamp;

        previousTimestamp = timestamp;

        earthGroup.rotation.y +=
            (elapsed / rotationDuration) *
            Math.PI * 2;

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    /*
       Keep the globe correctly proportioned if the webview
       changes size after waking.
    */
    function resizeEarth() {
        camera.aspect =
            window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }

    window.addEventListener(
        "resize",
        resizeEarth
    );
}
catch (error) {
    /*
       Preserve the existing PNG when WebGL or the remote
       Three.js module cannot load.
    */
    console.error(
        "Rotating Earth could not be initialized:",
        error
    );

    earthContainer.classList.add("fallback");
}
</script>

</body>
</html>
